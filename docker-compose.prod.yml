# ─────────────────────────────────────────────────────────────────────────
# Production stack for a single VM.
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# App:  mysql  ·  management (php-fpm)  ·  nginx (front)  ·  line-bot-service
# Obs:  loki · promtail · prometheus · cadvisor · grafana
#
# nginx is the only public port (80). LINE points at http(s)://<host>/webhook.
# Recommended VM: e2-medium (2 vCPU / 4 GB) — the observability stack needs RAM.
# ─────────────────────────────────────────────────────────────────────────
services:

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-line_knowledge}
      MYSQL_USER: ${DB_USERNAME:-line}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  management:
    build: ./line-bot-management
    image: line-bot-management:prod
    container_name: management
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-line_knowledge}
      DB_USERNAME: ${DB_USERNAME:-line}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BOT_API_TOKEN: ${BOT_API_TOKEN}
      RUN_MIGRATIONS: "true"
    # Entrypoint migrates + caches, then this seeds demo data and starts php-fpm.
    command:
      - sh
      - -c
      - >-
        php artisan db:seed --force
        && php artisan db:seed --class=DemoClinicDataSeeder --force
        && php artisan db:seed --class=LocalBotTokenSeeder --force
        && php-fpm
    volumes:
      # Share the built public/ assets with nginx (auto-populated from the image).
      - mgmt-public:/var/www/html/public
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    depends_on:
      management:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - mgmt-public:/var/www/html/public:ro
    restart: unless-stopped
    healthcheck:
      # End-to-end: reaches Laravel's /up through fastcgi, proving the web path works.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  line-bot-service:
    build: ./line-bot-service
    image: line-bot-service:prod
    container_name: line-bot-service
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      PORT: "8080"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      # Reach the Laravel knowledge/analytics API through nginx (php-fpm has no HTTP).
      KNOWLEDGE_API_URL: http://nginx
      ANALYTICS_API_URL: http://nginx
      KNOWLEDGE_API_TOKEN: ${BOT_API_TOKEN}
      ANALYTICS_API_TOKEN: ${BOT_API_TOKEN}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  # ── Observability ──────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./deploy/observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    logging: *logging

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    volumes:
      - ./deploy/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    logging: *logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    depends_on:
      - loki
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    logging: *logging

volumes:
  mysql-data:
  mgmt-public:
  loki-data:
  prometheus-data:
  grafana-data:
