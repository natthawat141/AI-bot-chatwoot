[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bot-chatwoot-service"
version = "0.1.0"
description = "Chatwoot AI orchestration service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "redis>=6,<7",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
