# Single front proxy for the whole stack.
#   /webhook, /health        -> FastAPI bot (uvicorn)
#   everything else (/, /api) -> Laravel management via php-fpm
#
# Upstreams use variables + Docker's embedded DNS (127.0.0.11) so nginx resolves
# them at request time, not at startup — otherwise nginx would refuse to boot
# whenever a backend container isn't up yet (e.g. the bot starts after nginx).
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20m;
    root /var/www/html/public;
    index index.php;

    # ── LINE bot (FastAPI) ────────────────────────────────────────────
    location = /webhook {
        set $bot line-bot-service;
        proxy_pass http://$bot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /health {
        set $bot line-bot-service;
        proxy_pass http://$bot:8080;
    }

    # ── Laravel management (php-fpm) ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $mgmt management;
        fastcgi_pass $mgmt:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
